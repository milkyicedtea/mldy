on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mldy-linux.tar.gz
          - os: windows-latest
            artifact: mldy-windows.zip
          - os: macos-latest
            artifact: mldy-macos.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.26'

      - name: Install wails3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build
        shell: bash
        run: wails3 build

      - name: Package
        shell: bash
        run: |
          cd bin
          mkdir -p ../dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a ../dist/${{ matrix.artifact }} mldy.exe
          else
            tar czf ../dist/${{ matrix.artifact }} mldy
          fi
        env:
          RUNNER_OS: ${{ runner.os }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
